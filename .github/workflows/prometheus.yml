name: Prometheus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Validate Docker Compose
      run: docker compose config

    - name: Check Prometheus Config
      run: docker run --rm -v ${{ github.workspace }}:/prometheus prom/prometheus:latest --config.file=/prometheus/prometheus.yml --check-config
